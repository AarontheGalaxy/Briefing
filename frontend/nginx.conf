server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — "always" so they apply to error responses too.
    # NOTE: nginx drops server-level add_header in any location that sets its
    # own add_header, so the /assets/ block repeats these.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Clerk domains allowed for auth (clerk-js CDN, API, avatars, web workers).
    # Using a production Clerk instance on a custom domain? Replace
    # *.clerk.accounts.dev with your clerk.<domain> here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com; connect-src 'self' https://*.clerk.accounts.dev; worker-src 'self' blob:; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API + health proxied to the backend container — same origin, no CORS needed
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;   # file uploads up to 50MB + form overhead
        proxy_read_timeout 180s;    # LLM analysis can be slow
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Serve static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # All other routes go to index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
