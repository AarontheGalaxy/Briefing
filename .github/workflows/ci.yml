name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ──────────────────────────────────────────────
  secret-scan:
    name: Secret & env file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if real .env files are committed
        run: |
          BAD=$(git ls-files | grep -E \
            '(^|/)\.env$|(^|/)\.env\.[^e]|(^|/)\.envrc$|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa$|service-account.*\.json$' \
            | grep -v '\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "Secret or env file tracked by git:"
            echo "$BAD"
            exit 1
          fi
          echo "No secret files found."

      - name: Check for database files in repo
        run: |
          BAD=$(git ls-files | grep -E '\.(db|sqlite|sqlite3)$' || true)
          if [ -n "$BAD" ]; then
            echo "Database file tracked by git:"
            echo "$BAD"
            exit 1
          fi
          echo "No database files found."

  # ──────────────────────────────────────────────
  backend:
    name: Backend — lint & security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pip-audit

      - name: Lint with ruff
        run: ruff check .

      - name: Security audit
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: timeout -k 5 120 pytest

  # ──────────────────────────────────────────────
  frontend:
    name: Frontend — type check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  # ──────────────────────────────────────────────
  docker:
    name: Single-container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Build deploy image
        run: docker build -t briefing:ci .

      - name: Smoke test — container serves SPA and API
        run: |
          docker run -d --name briefing-ci -p 8000:8000 \
            -e ALLOW_INSECURE_NO_AUTH=true \
            -e DATABASE_URL=sqlite+aiosqlite:///./data/ci.db \
            briefing:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          echo "--- health ---"
          curl -sf http://localhost:8000/health
          echo "--- SPA index ---"
          curl -sf http://localhost:8000/ | grep -q "<!doctype html>"
          echo "--- API returns JSON, not index.html ---"
          curl -sf http://localhost:8000/api/history | grep -q '"items"'
          echo "--- security headers ---"
          curl -sf -D- -o /dev/null http://localhost:8000/ | grep -qi 'content-security-policy'
          docker rm -f briefing-ci

      - name: Fail-closed check — no CLERK_ISSUER must abort startup
        run: |
          if docker run --rm -e DATABASE_URL=sqlite+aiosqlite:///./data/ci.db briefing:ci 2>&1 | grep -q "CLERK_ISSUER is not set"; then
            echo "Correctly refused to start without auth config."
          else
            echo "SECURITY: container started without CLERK_ISSUER!" && exit 1
          fi
