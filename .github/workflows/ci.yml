name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ──────────────────────────────────────────────
  secret-scan:
    name: Secret & env file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if real .env files are committed
        run: |
          BAD=$(git ls-files | grep -E \
            '(^|/)\.env$|(^|/)\.env\.[^e]|(^|/)\.envrc$|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa$|service-account.*\.json$' \
            | grep -v '\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "Secret or env file tracked by git:"
            echo "$BAD"
            exit 1
          fi
          echo "No secret files found."

      - name: Check for database files in repo
        run: |
          BAD=$(git ls-files | grep -E '\.(db|sqlite|sqlite3)$' || true)
          if [ -n "$BAD" ]; then
            echo "Database file tracked by git:"
            echo "$BAD"
            exit 1
          fi
          echo "No database files found."

  # ──────────────────────────────────────────────
  backend:
    name: Backend — lint & security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pip-audit

      - name: Lint with ruff
        run: ruff check .

      - name: Security audit
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: timeout -k 5 120 pytest

  # ──────────────────────────────────────────────
  frontend:
    name: Frontend — type check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
