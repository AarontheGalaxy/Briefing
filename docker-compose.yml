services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Not exposed publicly — only reachable via the nginx proxy in frontend
    volumes:
      # Persist the SQLite database across container restarts
      - briefing_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/meetings.db
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
      - ENABLE_OLLAMA=${ENABLE_OLLAMA:-true}
      - CLERK_ISSUER=${CLERK_ISSUER:-}
      # Deliberate opt-out of auth for local no-Clerk runs; never in prod
      - ALLOW_INSECURE_NO_AUTH=${ALLOW_INSECURE_NO_AUTH:-false}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
    # Allows the backend to reach Ollama running on the host machine
    # host.docker.internal is built-in on Mac/Windows; on Linux add host-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"  # no-op on Mac/Windows, required on Linux
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same origin: nginx proxies /api to the backend container
        VITE_API_URL: ${VITE_API_URL:-}
        # Clerk publishable key (pk_*) — empty = no-auth local mode
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  briefing_data:
